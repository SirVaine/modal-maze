        .glow-right { position: fixed; top: -10%; right: -10%; width: 800px; height: 800px; background: radial-gradient(circle, rgba(185, 28, 28, 0.08) 0%, transparent 60%); z-index: -3; pointer-events: none; }

        #particle-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; pointer-events: none; }
        
        #lobby { background: rgba(255, 255, 255, 0.95); color: #333; max-width: 600px; margin: 50px auto; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; z-index: 10; }
        .pin-display { font-size: 5em; font-weight: 900; letter-spacing: 10px; color: #46178f; margin: 20px 0; background: #f2f2f2; padding: 20px; border-radius: 10px; border: 2px dashed #ccc;}
        .player-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
        .player-badge { background: #e21b3c; color: white; padding: 10px 20px; border-radius: 5px; font-weight: bold; font-size: 1.2em; box-shadow: 2px 2px 0 #8b0015; }
        .setup-row { margin: 20px 0; font-size: 1.2em; font-weight: bold;}
        .setup-row input { font-size: 1.2em; width: 100px; text-align: center; padding: 5px; border-radius: 5px; border: 2px solid #ccc; outline: none; }
        
        button { padding: 15px 30px; font-size: 1.2em; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; box-shadow: 0 4px 0 rgba(0,0,0,0.2); transition: transform 0.1s; }
        button:active { transform: translateY(4px); box-shadow: none; }
        .btn-start { background: #26890c; color: white; width: 100%; font-size: 1.5em; margin-top: 20px; }
        .btn-start:disabled { background: #ccc; color: #888; cursor: not-allowed; box-shadow: none; }

        #game-area { display: none; position: relative; z-index: 10; }
        
        #fixed-ui { position: sticky; top: 10px; z-index: 1000; display: flex; justify-content: center;}
        #dice-box { 
            background: rgba(15, 5, 5, 0.85); border: 1px solid #ef4444;
            border-radius: 15px; padding: 20px 40px; width: 100%; max-width: 600px;

            font-size: 4em; font-weight: 900; margin: 15px 0; width: 100px; height: 100px;
            background: rgba(0,0,0,0.6); border: 3px solid #ef4444; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            text-shadow: 0 0 20px #ef4444; box-shadow: inset 0 0 20px rgba(239,68,68,0.3);
            transition: transform 0.1s;
        }

        #board-wrapper { width: 100%; overflow-x: auto; padding-bottom: 50px; margin-top: 20px;}

        #physical-board {
            background: transparent; border: none; padding: 40px; width: max-content; 
            margin: 0 auto; box-shadow: none; display: grid; gap: 25px; 
        }

        .block { 
            width: 80px; height: 80px; border-radius: 0px; border: 3px solid #222; 
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5); display: flex; flex-direction: column;

            position: relative; background: #fff; color: #333; transition: transform 0.2s;
        }

        .block-finish { background: #fdcb6e !important; color: black; border-color: #cc9f4b;}

        .action-back { background: #d63031 !important; color: white; border-color: #9e1c1d;} 
        .action-miss { background: #e17055 !important; color: white; border-color: #ab4d36;} 

        .icon { font-size: 2em; margin-bottom: 2px; }
        .text-label { font-size: 0.55em; text-transform: uppercase; letter-spacing: 1px; text-align: center; line-height: 1.1;}
        .block-num { font-size: 1.1em; position: absolute; top: 3px; left: 5px; color: rgba(0,0,0,0.8); font-weight: 900;}

        .player-pin { 
            position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 4px 10px; border-radius: 6px; 
            font-size: 0.85em; font-weight: 900; box-shadow: 0 4px 0 #000;

        let particlesArray = [];
        const starColors = ['239, 68, 68', '220, 38, 38', '185, 28, 28', '153, 27, 27'];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particlesArray = [];
            let numberOfParticles = (canvas.width * canvas.height) / 5000;
            for (let i = 0; i < numberOfParticles; i++) {
                let x = Math.random() * canvas.width;
                let y = Math.random() * canvas.height;
                let directionX = (Math.random() * 0.1) - 0.05; 
                let directionY = (Math.random() * 0.1) - 0.05; 
                let baseColor = starColors[Math.floor(Math.random() * starColors.length)];
                let size = (Math.random() * 2) + 0.5;
                particlesArray.push(new Particle(x, y, directionX, directionY, size, baseColor));
            }
        }

        class Particle {
            constructor(x, y, directionX, directionY, size, baseColor) {
                this.x = x; this.y = y; this.directionX = directionX; this.directionY = directionY;
                this.size = size; this.baseColor = baseColor;
                this.opacity = Math.random(); this.pulseSpeed = (Math.random() * 0.012) + 0.003; 
                this.pulseDir = Math.random() > 0.5 ? 1 : -1; 
            }
            draw() {
                ctx.fillStyle = `rgba(${this.baseColor}, ${this.opacity})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fill();
            }
            update() {
                if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
                if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;
                this.x += this.directionX; this.y += this.directionY;
                this.opacity += this.pulseSpeed * this.pulseDir;
                if (this.opacity >= 1) { this.opacity = 1; this.pulseDir = -1; } 
                else if (this.opacity <= 0.1) { this.opacity = 0.1; this.pulseDir = 1; }
                this.draw();
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) particlesArray[i].update();
        }

            { q: "You ___ talk to your friend if you have a problem.", opts: ["A) might", "B) may", "C) should", "D) mustn't"], correct: "C" },
            { q: "We ___ go to the zoo this weekend if the weather is good.", opts: ["A) must", "B) might", "C) should", "D) shouldn't"], correct: "B" },
            { q: "___ I speak to the manager, please?", opts: ["A) Must", "B) Should", "C) Might", "D) May"], correct: "D" },
            { q: "You ___ feed the animals in the zoo. It's forbidden.", opts: ["A) shouldn't", "B) mustn't", "C) might not", "D) may not"], correct: "B" },
            { q: "He studied a lot. He ___ pass the exam easily.", opts: ["A) might", "B) may", "C) should", "D) must"], correct: "C" }, // Expectation
            { q: "I ___ go to the gym later, but I feel a bit lazy.", opts: ["A) must", "B) might", "C) should", "D) shouldn't"], correct: "B" },
            { q: "Everyone ___ wear protective glasses in this area.", opts: ["A) may", "B) might", "C) should", "D) must"], correct: "D" },
            { q: "You ___ go to bed so late if you have to wake up early.", opts: ["A) shouldn't", "B) mustn't", "C) might not", "D) may not"], correct: "A" }
        ];
        
        let availableQuestions = [];
        let currentQuestion = null;

        function getRandomQuestion() {
            if (availableQuestions.length === 0) {
                availableQuestions = [...questionsList]; 
            }
            let randomIndex = Math.floor(Math.random() * availableQuestions.length);
            return availableQuestions.splice(randomIndex, 1)[0]; 
        }

        function createRoom() {
            socket.emit('createRoom');
            document.getElementById('btn-create').style.display = 'none';
        }

        socket.on('roomCreated', (pin) => {
            myPin = pin;
            document.getElementById('lobby-info').style.display = 'block';
            document.getElementById('display-pin').innerText = pin;
        });

        socket.on('updateLobby', (players) => {
            playersData = players;
            playerIds = Object.keys(playersData); 
            
            const wrapper = document.getElementById('players-wrapper');
            wrapper.innerHTML = '';
            let count = 0;
            for(let id in players) { count++; wrapper.innerHTML += `<div class="player-badge">${players[id].name}</div>`; }
            document.getElementById('player-count').innerText = count;
            document.getElementById('btn-start').disabled = count === 0;
        });

        function startGame() {
            finalSize = parseInt(document.getElementById('board-size').value);
            if(finalSize < 20) finalSize = 20;
            if(finalSize > 120) finalSize = 120;
            
            socket.emit('startGame', { pin: myPin, size: finalSize });
            
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            
            currentTurnIndex = 0;
            availableQuestions = [...questionsList]; // Inicia o pool de 100 perguntas
            updateTurnUI();
            generateRandomBoard();
        }

        function updateTurnUI() {
            if(playerIds.length === 0) return;
            let currentPlayerId = playerIds[currentTurnIndex];
            let currentPlayer = playersData[currentPlayerId];
            
            if (currentPlayer.missTurn) {
                currentPlayer.missTurn = false;
                document.getElementById('turn-text').innerText = `${currentPlayer.name} MISSED TURN!`;
                document.getElementById('dice-display').innerText = '🛑';
                setTimeout(() => {
                    currentTurnIndex++;
                    if(currentTurnIndex >= playerIds.length) currentTurnIndex = 0;
                    updateTurnUI();
                }, 2500);
                return;
            }

            document.getElementById('turn-text').innerText = `Turn: ${currentPlayer.name}`;
            document.getElementById('dice-display').innerText = '🎲';
            socket.emit('setPlayerState', { playerId: currentPlayerId, state: 'DICE' });
        }

        socket.on('diceResultHost', (data) => {
            if(isRolling) return;
            isRolling = true;
            
            let diceDisplay = document.getElementById('dice-display');
            let rolls = 0;
            let interval = setInterval(() => {
                diceDisplay.innerText = Math.floor(Math.random() * 7) + 1;
                diceDisplay.style.transform = `scale(${1 + (Math.random() * 0.2)}) rotate(${(Math.random() * 20) - 10}deg)`;
                
                rolls++;
                if(rolls > 15) {
                    clearInterval(interval);
                    diceDisplay.style.transform = `scale(1) rotate(0deg)`;
                    diceDisplay.innerText = data.result;
                    
                    moveCurrentPlayer(data.result);
                }
            }, 80);
        });

        function moveCurrentPlayer(spaces) {
            let id = playerIds[currentTurnIndex];
            let currentPos = playersData[id].position || 1;
            let targetPos = currentPos + spaces;
            if(targetPos > finalSize) targetPos = finalSize;
            
            let stepInterval = setInterval(() => {
                if(currentPos < targetPos) {
                    currentPos++;
                    playersData[id].position = currentPos;
                    updatePins();
                } else {
                    clearInterval(stepInterval);
                    
                    let blockType = boardMap[currentPos];

                    if (blockType === 'shortcut') {
                        let wormholeEnd = Math.min(currentPos + 10, finalSize);
                        flyThroughSpace(id, currentPos, wormholeEnd);
                    } 
                    else if (blockType === 'hazard') {
                        currentQuestion = getRandomQuestion(); 
                        document.getElementById('dice-box').style.display = 'none';
                        document.getElementById('question-box').style.display = 'flex';
                        document.getElementById('q-text').innerText = currentQuestion.q;
                        document.getElementById('q-opts').innerHTML = currentQuestion.opts.join('<br>');

                        socket.emit('setPlayerState', { playerId: id, state: 'QUESTION' });
                    } 
                    else {
                        if (blockType === 'back') {
                            playersData[id].position = Math.max(1, currentPos - 2);
                            updatePins();
                        } else if (blockType === 'miss') {
                            playersData[id].missTurn = true;
                        }
                        
                        setTimeout(() => {
                            currentTurnIndex++;
                            if(currentTurnIndex >= playerIds.length) currentTurnIndex = 0;
                            isRolling = false;
                            updateTurnUI();
                        }, 1500);
                    }
                }
            }, 300); 
        }

        function flyThroughSpace(id, startPos, endPos) {
            let startBlock = document.getElementById(`block-${startPos}`);
            let endBlock = document.getElementById(`block-${endPos}`);
            
            let rocket = document.createElement('div');
            rocket.innerHTML = '🚀';
            rocket.style.position = 'fixed';
            rocket.style.fontSize = '4em';
            rocket.style.zIndex = '9999';
            rocket.style.transition = 'all 1s ease-in-out'; 
            rocket.style.filter = 'drop-shadow(0 0 15px #c4b5fd)'; 
            
            let startRect = startBlock.getBoundingClientRect();
            let endRect = endBlock.getBoundingClientRect();
            
            rocket.style.left = startRect.left + 'px';
            rocket.style.top = startRect.top + 'px';
            document.body.appendChild(rocket);

            let pinEl = startBlock.querySelector('.player-pin');
            if(pinEl) pinEl.style.display = 'none';

            setTimeout(() => {
                rocket.style.left = endRect.left + 'px';
                rocket.style.top = endRect.top + 'px';
                rocket.style.transform = 'scale(2) rotate(1080deg)';
            }, 50);

            setTimeout(() => {
                rocket.remove();
                playersData[id].position = endPos;
                updatePins();
                
                setTimeout(() => {
                    currentTurnIndex++;
                    if(currentTurnIndex >= playerIds.length) currentTurnIndex = 0;
                    isRolling = false;
                    updateTurnUI();
                }, 1000);
            }, 1050);
        }

        socket.on('answerReceivedHost', (data) => {
            document.getElementById('question-box').style.display = 'none';
            document.getElementById('dice-box').style.display = 'flex';
            
            let id = playerIds[currentTurnIndex];
            let p = playersData[id];

            if(data.answer === currentQuestion.correct) {
                document.getElementById('dice-display').innerText = '✅';
                p.position = Math.min((p.position || 1) + 1, finalSize); 
            } else {
                document.getElementById('dice-display').innerText = '❌';
                p.position = Math.max(1, (p.position || 1) - 1); 
            }

            updatePins(); 

            setTimeout(() => {
                let blockType = boardMap[p.position];

                if (blockType === 'shortcut') {
                    let wormholeEnd = Math.min(p.position + 10, finalSize);
                    flyThroughSpace(id, p.position, wormholeEnd);
                } 
                else {
                    if (blockType === 'back') {
                        p.position = Math.max(1, p.position - 2);
                        updatePins();
                    } else if (blockType === 'miss') {
                        p.missTurn = true;
                    }
                    
                    // Se for 'hazard' (pergunta), não faz nada. Passa a vez para evitar loop infinito.
                    setTimeout(() => {
                        currentTurnIndex++;
                        if(currentTurnIndex >= playerIds.length) currentTurnIndex = 0;
                        isRolling = false;
                        updateTurnUI();
                    }, 1500);
                }
            }, 1500); 
        });

        function generateOrganicPath(size) {
            for (let attempt = 0; attempt < 5000; attempt++) {
                let path = [{x: 0, y: 0}];
                let grid = new Set(["0,0"]);
                let currentDir = {dx: 1, dy: 0}; 
                let stuck = false;
                
                let limit = Math.max(8, Math.ceil(Math.sqrt(size) * 1.5));

                for (let i = 1; i < size; i++) {
                    let head = path[path.length - 1];
                    let straight = currentDir;
                    let rightTurn = {dx: -currentDir.dy, dy: currentDir.dx};
                    let leftTurn = {dx: currentDir.dy, dy: -currentDir.dx};
                    
                    let dirsToTry = [straight, rightTurn, leftTurn];
                    
                    if (Math.random() < 0.35) {
                        let swapIdx = Math.random() < 0.5 ? 1 : 2;
                        dirsToTry[0] = dirsToTry[swapIdx];
                        dirsToTry[swapIdx] = straight;
                    }

                    let moved = false;
                    for (let d of dirsToTry) {
                        let nx = head.x + d.dx;
                        let ny = head.y + d.dy;
                        let key = nx + "," + ny;

                        if (nx >= 0 && nx < limit && ny >= 0 && ny < limit && !grid.has(key)) {
                            let neighbors = 0;
                            let checkDirs = [[1,0], [-1,0], [0,1], [0,-1]];
                            for (let cd of checkDirs) {
                                if (grid.has((nx + cd[0]) + "," + (ny + cd[1]))) neighbors++;
                            }

                            let diagNeighbors = 0;
                            let diagDirs = [[1,1], [1,-1], [-1,1], [-1,-1]];
                            for (let dd of diagDirs) {
                                if (grid.has((nx + dd[0]) + "," + (ny + dd[1]))) diagNeighbors++;
                            }

                            if (neighbors === 1 && diagNeighbors <= 2) {
                                path.push({x: nx, y: ny});
                                grid.add(key);
                                currentDir = d;
                                moved = true;
                                break;
                            }
                        }
                    }
                    if (!moved) { stuck = true; break; }
                }
                if (!stuck) return path; 
            }
            
            let fallback = [];
            let r = 0, c = 0, dir = 1;
            let limit = Math.ceil(Math.sqrt(size));
            for(let i=0; i<size; i++) {
                fallback.push({x: c, y: r});
                c += dir;
                if (c >= limit || c < 0) { dir *= -1; c += dir; r += 2; }
            }
            return fallback;
        }

        function generateRandomBoard() {
            boardMap = new Array(finalSize + 1).fill('hazard');
            boardMap[1] = 'start';
            boardMap[finalSize] = 'finish';

            let numActions = Math.max(1, Math.floor(finalSize / 15)); 
            let actions = [];
            for(let i=0; i<numActions; i++) {
                actions.push('shortcut'); actions.push('back'); actions.push('miss');
            }
            
            actions.push('shortcut'); 

            actions.forEach(action => {
                let placed = false;
                let attempts = 0;
                while(!placed && attempts < 200) {
                    let randPos = Math.floor(Math.random() * (finalSize - 4)) + 3; 
                    
                    let isSpaced = true;
                    for(let offset = -2; offset <= 2; offset++) {
                        let checkPos = randPos + offset;
                        if(checkPos > 1 && checkPos < finalSize && boardMap[checkPos] !== 'hazard') {
                            isSpaced = false;
                            break;
                        }
                    }

                    if(isSpaced) { 
                        boardMap[randPos] = action; 
                        placed = true; 
                    }
                    attempts++;
                }
            });
            renderBoardView();
        }

        function renderBoardView() {
            const boardDiv = document.getElementById('physical-board');
            boardDiv.innerHTML = '';
            
            let pathCoords = generateOrganicPath(finalSize);

            let minX = Math.min(...pathCoords.map(p => p.x));
            let minY = Math.min(...pathCoords.map(p => p.y));
            let maxX = Math.max(...pathCoords.map(p => p.x));
            let maxY = Math.max(...pathCoords.map(p => p.y));

            let cols = maxX - minX + 1;
            let rows = maxY - minY + 1;
            
            boardDiv.style.gridTemplateColumns = `repeat(${cols}, 80px)`;
            boardDiv.style.gridTemplateRows = `repeat(${rows}, 80px)`;

            for (let i = 1; i <= finalSize; i++) {
                let coord = pathCoords[i-1];
                let block = document.createElement('div');
                block.className = 'block';
                block.id = `block-${i}`;
                
                block.style.gridColumn = (coord.x - minX + 1);
                block.style.gridRow = (coord.y - minY + 1);
                
                let type = boardMap[i];
                let icon = '❓'; let text = 'Question';
                
                if (type === 'start') { block.classList.add('block-start'); icon = '🏁'; text = 'START'; }
                else if (type === 'finish') { block.classList.add('block-finish'); icon = '🏆'; text = 'WINNER'; }
                else if (type === 'shortcut') { block.classList.add('action-shortcut'); icon = '🌀'; text = 'Wormhole +10'; }
                else if (type === 'back') { block.classList.add('action-back'); icon = '💀'; text = 'Go back 2'; }
                else if (type === 'miss') { block.classList.add('action-miss'); icon = '🛑'; text = 'Miss Turn'; }
                else { 
                    block.classList.add('action-hazard'); 
                    block.style.background = hazardColors[i % hazardColors.length];
                }

                block.innerHTML = `
                    <div class="block-num">${i}</div>
                    <div class="icon">${icon}</div>
                    <div class="text-label">${text}</div>
                `;
                
                boardDiv.appendChild(block);
            }
            updatePins();
        }

        function updatePins() {
            document.querySelectorAll('.player-pin').forEach(e => e.remove());
            for (let id in playersData) {
                let pos = playersData[id].position || 1;
                if(pos > finalSize) pos = finalSize;

                let block = document.getElementById(`block-${pos}`);
                if(block) block.innerHTML += `<div class="player-pin">🚀 ${playersData[id].name}</div>`;
            }
        }
    </script>
