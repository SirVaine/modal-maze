<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play - Modal Maze</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; margin: 0; padding: 0; text-align: center; 
            background: #040202; color: white; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        .glow-left { position: fixed; bottom: -10%; left: -10%; width: 800px; height: 800px; background: radial-gradient(circle, rgba(239, 68, 68, 0.12) 0%, transparent 60%); z-index: -3; }
        .glow-right { position: fixed; top: -10%; right: -10%; width: 800px; height: 800px; background: radial-gradient(circle, rgba(185, 28, 28, 0.08) 0%, transparent 60%); z-index: -3; }
        #particle-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; pointer-events: none; }

        h1.logo { font-size: 3em; margin-bottom: 20px; font-weight: 900; letter-spacing: -2px; z-index: 10; text-shadow: 0 0 20px rgba(239, 68, 68, 0.5);}
        h1.logo span { color: #ef4444; }

        #login-screen, #waiting-screen, #dice-screen { 
            background: rgba(15, 5, 5, 0.85); padding: 30px; border-radius: 12px; 
            border: 1px solid rgba(239, 68, 68, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 90%; max-width: 320px; z-index: 10; backdrop-filter: blur(5px);
        }

        input { 
            padding: 15px; font-size: 1.1em; border-radius: 8px; border: 1px solid rgba(239, 68, 68, 0.5); 
            background: rgba(0,0,0,0.5); color: white; text-align: center; width: 100%; box-sizing: border-box; 
            margin-bottom: 15px; font-weight: bold; outline: none; transition: 0.3s;
        }
        input:focus { border-color: #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }

        button.join-btn { 
            padding: 15px; font-size: 1.2em; font-weight: 900; color: #000; 
            background: #ef4444; border: none; border-radius: 8px; cursor: pointer; 
            width: 100%; box-sizing: border-box; text-transform: uppercase; transition: 0.2s;
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.3);
        }
        button.join-btn:active { transform: scale(0.95); box-shadow: none; }

        #waiting-screen, #dice-screen { display: none; }
        #waiting-screen h2, #dice-screen h2 { margin: 0 0 10px 0; color: #ef4444; }

        /* KATOOT CONTROLLER NO DARK MODE */
        #controller { display: none; width: 100%; height: 100%; padding: 10px; box-sizing: border-box; z-index: 10; }
        .status { font-size: 1.5em; font-weight: bold; margin: 20px 0; color: white; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 15px; height: calc(100vh - 120px); }
        .btn { 
            border: 2px solid rgba(255,255,255,0.2); border-radius: 12px; font-size: 3em; color: white; font-weight: bold; 
            cursor: pointer; box-shadow: 0 8px 15px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s;
        }
        .btn:active:not(:disabled) { transform: translateY(6px); box-shadow: none; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: transparent;}
        
        .btn-a { background: linear-gradient(135deg, #e21b3c, #9c132a); }
        .btn-b { background: linear-gradient(135deg, #1368ce, #0d4a96); }
        .btn-c { background: linear-gradient(135deg, #d89e00, #9e7400); }
        .btn-d { background: linear-gradient(135deg, #26890c, #1a5e08); }
    </style>
</head>
<body>
    <div class="glow-left"></div><div class="glow-right"></div>
    <canvas id="particle-canvas"></canvas>

    <h1 class="logo" id="logo-text">MODAL <span>MAZE</span></h1>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <input type="text" id="pinInput" placeholder="Game PIN" autocomplete="off">
        <input type="text" id="nameInput" placeholder="Nickname" autocomplete="off">
        <button class="join-btn" onclick="joinRoom()">JOIN GAME</button>
    </div>

    <!-- TELA DE ESPERA -->
    <div id="waiting-screen">
        <h2>You're in!</h2>
        <p style="color: #a1a1aa;">See your nickname on screen</p>
    </div>

    <!-- TELA DO DADO -->
    <div id="dice-screen">
        <h2>Your Turn!</h2>
        <button class="join-btn" onclick="roll()">ROLL DICE</button>
    </div>

    <!-- CONTROLE DO JOGO -->
    <div id="controller">
        <div class="status" id="status-text">Get Ready!</div>
        <div class="grid">
            <button class="btn btn-a" onclick="sendAnswer('A')" disabled>A</button>
            <button class="btn btn-b" onclick="sendAnswer('B')" disabled>B</button>
            <button class="btn btn-c" onclick="sendAnswer('C')" disabled>C</button>
            <button class="btn btn-d" onclick="sendAnswer('D')" disabled>D</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentPin = '';

        function joinRoom() {
            const pin = document.getElementById('pinInput').value;
            const name = document.getElementById('nameInput').value;
            if(pin && name) {
                currentPin = pin;
                socket.emit('joinRoom', { pin: pin, name: name });
            }
        }

        socket.on('joinSuccess', (pin) => {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('waiting-screen').style.display = 'block';
        });

        socket.on('joinError', (msg) => { alert(msg); });

        socket.on('changeState', (state) => {
            document.getElementById('logo-text').style.display = 'none';
            document.getElementById('waiting-screen').style.display = 'none';
            document.getElementById('controller').style.display = 'none';
            document.getElementById('dice-screen').style.display = 'none';

            if(state === 'DICE') {
                document.getElementById('dice-screen').style.display = 'block';
            } else if (state === 'QUESTION') {
                document.getElementById('controller').style.display = 'block';
                document.querySelectorAll('.btn').forEach(btn => btn.disabled = false);
                document.getElementById('status-text').innerText = "Choose an answer!";
            } else {
                document.getElementById('waiting-screen').style.display = 'block';
            }
        });

        function roll() {
            socket.emit('rollDice', { pin: currentPin });
            document.getElementById('dice-screen').style.display = 'none';
            document.getElementById('waiting-screen').style.display = 'block';
        }

        function sendAnswer(answer) {
            socket.emit('submitAnswer', { pin: currentPin, answer: answer });
            document.querySelectorAll('.btn').forEach(btn => btn.disabled = true);
            document.getElementById('status-text').innerText = "Answer sent! Waiting...";
        }

        const canvas = document.getElementById('particle-canvas'); const ctx = canvas.getContext('2d'); let particlesArray = [];
        const starColors = ['239, 68, 68', '220, 38, 38', '185, 28, 28', '153, 27, 27'];
        function initCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; particlesArray = []; let numberOfParticles = (canvas.width * canvas.height) / 5000; for (let i = 0; i < numberOfParticles; i++) { let x = Math.random() * canvas.width; let y = Math.random() * canvas.height; let directionX = (Math.random() * 0.1) - 0.05; let directionY = (Math.random() * 0.1) - 0.05; let baseColor = starColors[Math.floor(Math.random() * starColors.length)]; let size = (Math.random() * 2) + 0.5; particlesArray.push(new Particle(x, y, directionX, directionY, size, baseColor)); } }
        class Particle { constructor(x, y, directionX, directionY, size, baseColor) { this.x = x; this.y = y; this.directionX = directionX; this.directionY = directionY; this.size = size; this.baseColor = baseColor; this.opacity = Math.random(); this.pulseSpeed = (Math.random() * 0.012) + 0.003; this.pulseDir = Math.random() > 0.5 ? 1 : -1; } draw() { ctx.fillStyle = `rgba(${this.baseColor}, ${this.opacity})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false); ctx.fill(); } update() { if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX; if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY; this.x += this.directionX; this.y += this.directionY; this.opacity += this.pulseSpeed * this.pulseDir; if (this.opacity >= 1) { this.opacity = 1; this.pulseDir = -1; } else if (this.opacity <= 0.1) { this.opacity = 0.1; this.pulseDir = 1; } this.draw(); } }
        function animate() { requestAnimationFrame(animate); ctx.clearRect(0, 0, canvas.width, canvas.height); for (let i = 0; i < particlesArray.length; i++) particlesArray[i].update(); }
        window.addEventListener('resize', initCanvas); initCanvas(); animate();
    </script>
</body>
</html>
